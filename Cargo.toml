[package]
name = "odbc-rust-proxy"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PLPsiSoft/odbc-rust-proxy"

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
odbc-api = "30.1.0"
anyhow = "1.0"
encoding_rs = "0.8"
windows-service = "0.8"


#https://github.com/johnthagen/min-sized-rust
[profile.release]
lto = true
codegen-units = 1
panic = 'unwind'
strip = true
rpath = true
opt-level = "z" 